><text class="n" x="106.0" y="766.0" text-anchor="start">① 탱크 트레이: 포켓 둘레의 트레이 몸통이 섬프와 같은 높이의 저수조. 사용 가능 수량 약 0.94L</text><text class="n" x="106.0" y="784.0" text-anchor="start">② 아무리 부어도 물은 트레이 윗면(30) 위로 못 오른다. 섬프 상단(32)보다 낮아 흙이 잠기지 않는다</text><text class="n" x="106.0" y="802.0" text-anchor="start">③ 황동 플로트가 넥 위로 솟은 높이가 남은 물. 평평해지면 급수</text><text class="n" x="106.0" y="820.0" text-anchor="start">④ 통풍구는 흙면 위 바스켓 측벽과 쉘 림 아래 · 콘은 공극률 3단 카트리지</text><text class="n" x="748.0" y="442.0" text-anchor="start">다공성 세라믹 콘</text><text class="n" x="748.0" y="460.0" text-anchor="start">+ 부직포 필터 링</text></svg>